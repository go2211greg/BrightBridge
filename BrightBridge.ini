# BrightBridge configuration
#
# targets        substring of the monitor name to drive; blank = every DDC/CI monitor
# step           how much one key press moves the control
# snap           land on exact multiples of step, the way the Windows flyout does
# osd            show our own on-screen readout (Windows draws its own regardless)
# repeat         hold a key to keep moving
# repeatRateMs   250 = 4 Hz, matching the rate the Windows flyout advances at
#
# bind = <matcher> => <control>:<amount>
#   matcher   usage:PPPP/UUUU     decoded HID usage (page/usage)
#             bit:PPPP/RR/N/MM    vendor report bit (page/reportId/byteIndex/bitMask)
#             vk:XX               virtual key code
#   control   brightness | contrast | volume | vcpXX
#   amount    +step -step +N -N =N
#
# Run  BrightBridge.exe --spy  to discover what your keys emit.

targets=
step=10
snap=true
osd=false
repeat=true
repeatDelayMs=400
repeatRateMs=300

bind=usage:000C/006F => brightness:+step
bind=usage:000C/0070 => brightness:-step
